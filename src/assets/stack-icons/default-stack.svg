<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="layer1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2d2b5f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3a3870;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="layer2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3d3a7f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4a4690;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="layer3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4f4ba0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5c57b0;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="layer4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#615eff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7d79ff;stop-opacity:1" />
    </linearGradient>
    
    <!-- Shadow filter -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgGradient)"/>
  
  <!-- Stack layers with clear separation -->
  <g transform="translate(200, 200)">
    <!-- Layer 1 (Bottom) -->
    <rect x="-140" y="70" width="280" height="50" rx="6" fill="url(#layer1)" stroke="#1a1a2e" stroke-width="2" filter="url(#shadow)">
      <animate attributeName="y" values="70;64;70" dur="2.5s" repeatCount="indefinite"/>
    </rect>
    
    <!-- Layer 2 -->
    <rect x="-130" y="10" width="260" height="50" rx="6" fill="url(#layer2)" stroke="#252350" stroke-width="2" filter="url(#shadow)">
      <animate attributeName="y" values="10;4;10" dur="2.5s" begin="0.3s" repeatCount="indefinite"/>
    </rect>
    
    <!-- Layer 3 -->
    <rect x="-120" y="-50" width="240" height="50" rx="6" fill="url(#layer3)" stroke="#2d2b5f" stroke-width="2" filter="url(#shadow)">
      <animate attributeName="y" values="-50;-56;-50" dur="2.5s" begin="0.6s" repeatCount="indefinite"/>
    </rect>
    
    <!-- Layer 4 (Top) -->
    <rect x="-110" y="-110" width="220" height="50" rx="6" fill="url(#layer4)" stroke="#3d3a7f" stroke-width="2" filter="url(#shadow)">
      <animate attributeName="y" values="-110;-116;-110" dur="2.5s" begin="0.9s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>